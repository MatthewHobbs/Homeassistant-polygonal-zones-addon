# Digest-pinned HA base images per architecture. Used by build.yml's matrix
# generator (whose output release.yml also publishes from) to produce a BUILD_FROM
# reference that docker pins by sha256, so a mutable-tag repush upstream
# cannot change the base. Alpine packages installed on top are not pinned,
# so rebuilds of the same git SHA are not guaranteed identical.
#
# This is NOT a Home Assistant convention file — HA's addon linter and
# Supervisor read polygonal_zones_editor/build.yaml, which keeps plain
# tags for schema compliance. The digests live here in .github/ so the
# linter leaves them alone.
#
# Renovate's customManager in .github/renovate.json5 keeps the digests
# fresh; if Renovate isn't installed, refresh manually with:
#
#   for arch in aarch64 amd64; do
#     TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:home-assistant/${arch}-base:pull" | jq -r .token)
#     curl -sI \
#       -H "Authorization: Bearer $TOKEN" \
#       -H "Accept: application/vnd.oci.image.index.v1+json" \
#       "https://ghcr.io/v2/home-assistant/${arch}-base/manifests/3.24" \
#       | awk '/docker-content-digest/{print $2}'
#   done
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.24@sha256:aacbf5d8c17fe5682b0d0bc5a523cd14cbd5481bd9124eb312d8aa2e9d796840
  amd64:   ghcr.io/home-assistant/amd64-base:3.24@sha256:20d9028d56eaa3dd3013f6e0a7957b4911e4c71e14f85d1f609bba4fe429e84a
