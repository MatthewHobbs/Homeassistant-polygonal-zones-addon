name: Build addon

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Release workflow calls this as a prerequisite gate, so a tag push never
  # publishes an image that hasn't been boot-smoked; test.yml and lint.yml
  # never run the image.
  workflow_call:
    outputs:
      include:
        # release.yml's publish matrix, so there is one arch table, not two.
        description: Arch matrix generated from build.yaml and base-images.yaml
        value: ${{ jobs.matrix.outputs.include }}

permissions:
  contents: read

concurrency:
  # Prefix with "build-" so this doesn't share a group with test.yml /
  # lint.yml when all three are called from release.yml. Reusable workflows
  # inherit the caller's `github.workflow` and `github.ref`, so a plain
  # "${{ github.workflow }}-${{ github.ref }}" group collides with the
  # others and cancels whichever runs second.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Resolve build matrix from build.yaml
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate matrix
        id: gen
        # Arch list comes from polygonal_zones_editor/build.yaml (the
        # HA-linter-approved file with plain tags). Digest-pinned base
        # refs come from .github/base-images.yaml. The two files must
        # agree on arch keys and on each tag; we fail fast otherwise.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml
          with open("polygonal_zones_editor/build.yaml") as f:
              tags = yaml.safe_load(f)["build_from"]
          with open(".github/base-images.yaml") as f:
              refs = yaml.safe_load(f)["build_from"]
          if tags.keys() != refs.keys():
              raise SystemExit(
                  f"arch mismatch: build.yaml={sorted(tags)} "
                  f"vs base-images.yaml={sorted(refs)}"
              )
          stale = {a: (tags[a], refs[a]) for a in tags if refs[a].split("@")[0] != tags[a]}
          if stale:
              raise SystemExit(f"base image tag mismatch (build.yaml, base-images.yaml): {stale}")
          arch_to_platform = {
              "aarch64": "linux/arm64",
              "amd64":   "linux/amd64",
          }
          # Each arch builds and boots on a native runner, as
          # home-assistant/addons' builder.yml does, so the smoke and
          # Playwright run the real binaries rather than QEMU's emulation.
          arch_to_runner = {
              "aarch64": "ubuntu-24.04-arm",
              "amd64":   "ubuntu-latest",
          }
          missing = set(tags) - (set(arch_to_platform) & set(arch_to_runner))
          if missing:
              raise SystemExit(f"unknown arches: {sorted(missing)}")
          includes = [
              {
                  "arch": arch,
                  "platform": arch_to_platform[arch],
                  "runner": arch_to_runner[arch],
                  "base": refs[arch],
              }
              for arch in tags
          ]
          print("include=" + json.dumps(includes))
          PY

  docker-build:
    name: Build (${{ matrix.arch }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same BuildKit pin as release.yml's publish job.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea # v0.33.1
      # Smoke-test every arch, each natively on its own runner, which catches
      # arm64-specific boot regressions before they reach RPi / HA Yellow /
      # HA Green users.
      # Verifies the addon boots under a Supervisor-style /data mount (root-owned
      # options.json).
      - name: Build polygonal_zones_editor image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./polygonal_zones_editor
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          push: false
          load: true
          tags: polygonal-zones:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot container and probe endpoints
        run: |
          set -euo pipefail
          DATA=$(mktemp -d)
          # The probes below come from the runner, not ingress, so they need
          # save_token; ui_smoke.py sends the same SMOKE_TOKEN.
          TOKEN=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from draw_and_save import SMOKE_TOKEN; print(SMOKE_TOKEN)')
          AUTH="X-Save-Token: $TOKEN"
          # Simulate the Supervisor mount: options.json is root-owned. The
          # addon must still be able to read it.
          sudo install -o root -g root -m 0644 /dev/stdin "$DATA/options.json" <<< "{\"save_token\":\"$TOKEN\",\"zone_colour\":\"green\"}"

          docker run -d --name smoke -p 8000:8000 -v "$DATA":/data polygonal-zones:smoke

          # Wait up to 90s for /healthz (generous headroom for a cold runner).
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/healthz | grep -q ok; then
              echo "OK /healthz responded on attempt $i"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "FAIL /healthz never responded"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done

          # A LAN client without the token is refused.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/zones.json)
          if [ "$CODE" != "403" ]; then
            echo "FAIL /zones.json without X-Save-Token returned $CODE, expected 403"
            exit 1
          fi
          echo "OK /zones.json without X-Save-Token refused"

          # /zones.json must return a valid empty FeatureCollection (seeded at
          # startup if /data/polygonal_zones/zones.json is absent).
          curl -fsS -H "$AUTH" http://127.0.0.1:8000/zones.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("type")=="FeatureCollection" and isinstance(d.get("features"), list), d; print("OK /zones.json shape")'

          # No Supervisor token in this container, so the save must report that
          # it could not ask Home Assistant to reload — and must still succeed.

          # /save_zones round-trip with Polygon and MultiPolygon features: the
          # MultiPolygon exercises the shape-count indicator and the toGeoJSON export.
          # The payload is SMOKE_ZONES, shared with the pilot. Each command stands alone
          # so `set -e` sees its status.
          PAYLOAD=$(python3 -c 'import json, sys; sys.path.insert(0, "scripts"); from draw_and_save import SMOKE_ZONES; print(json.dumps(SMOKE_ZONES))')
          SAVED=$(curl -fsS -X POST -H 'Content-Type: application/json' -H "$AUTH" \
            --data "$PAYLOAD" http://127.0.0.1:8000/save_zones)
          python3 -c 'import json, sys; d = json.loads(sys.argv[1]); assert d.get("status") == "ok", d; r = d.get("reload") or {}; assert r.get("state") == "unreachable", d' "$SAVED"
          echo "OK /save_zones round-trip, and reports the missing Supervisor"
          # SMOKE_ZONES carry no ids, so the server must have filled one in
          # for each: the integration binds automations to it.
          STORED=$(curl -fsS -H "$AUTH" http://127.0.0.1:8000/zones.json)
          python3 -c 'import json, re, sys; fs = json.loads(sys.argv[1])["features"]; ids = [(f.get("properties") or {}).get("id") or "" for f in fs]; assert len(fs) == 2 and len(set(ids)) == 2 and all(re.fullmatch("[0-9a-f]{32}", i) for i in ids), fs' "$STORED"
          echo "OK the server gave every saved zone an id"

          # The web service must run as the Dockerfile's `app` user, uid 1001.
          # Regression guard for #14. Rejecting only uid 0 would pass a drop to
          # the wrong account. BusyBox ps doesn't support -p, so read /proc.
          PID=$(docker exec smoke pgrep -f 'python main.py' | head -n1 || true)
          if [ -z "$PID" ]; then
            echo "FAIL could not locate python main.py process"
            docker exec smoke ps || true
            docker logs smoke
            exit 1
          fi
          WEB_UID=$(docker exec smoke awk '/^Uid:/{print $2}' "/proc/$PID/status")
          WEB_USER=$(docker exec smoke awk -F: -v uid="$WEB_UID" '$3 == uid {print $1}' /etc/passwd)
          if [ "$WEB_UID" != "1001" ] || [ "$WEB_USER" != "app" ]; then
            echo "FAIL web service runs as uid=${WEB_UID:-?}(${WEB_USER:-?}), expected uid=1001(app)"
            docker logs smoke
            exit 1
          fi
          echo "OK web service runs as uid=$WEB_UID($WEB_USER)"

          # The web user must not be able to rewrite its own code: nothing
          # under /app may belong to it or be writable by it. Assignments, so
          # a failed docker exec stops the step instead of reading as empty.
          NOT_ROOT=$(docker exec smoke find /app ! -user 0)
          if [ -n "$NOT_ROOT" ]; then
            echo "FAIL not owned by root under /app: $NOT_ROOT"
            exit 1
          fi
          APP_WRITABLE=$(docker exec -u 1001 smoke sh -c 'find /app | while read -r p; do [ -w "$p" ] && echo "$p"; done; true')
          if [ -n "$APP_WRITABLE" ]; then
            echo "FAIL writable by uid 1001 under /app: $APP_WRITABLE"
            exit 1
          fi
          echo "OK /app is root-owned and read-only to uid 1001"

      # Headless-browser smoke: load index.html, ensure no JS errors and that
      # the zones POSTed above actually render. The checks are in
      # scripts/ui_smoke.py.
      - name: Frontend smoke (Playwright)
        run: |
          set -euo pipefail
          # Hash-locked, and the same playwright as the Supervisor pilot's
          # image, so both browser smokes drive one client version.
          python3 -m pip install --quiet --require-hashes -r scripts/supervisor-probe-requirements.txt
          python3 -m playwright install --with-deps chromium >/dev/null
          python3 scripts/ui_smoke.py

      # A handled exception can still leave every probe and the browser smoke
      # green, so read the log once all of that traffic has run. Capture first:
      # `docker logs | grep -q` under pipefail can SIGPIPE the writer and turn
      # a match into a miss.
      - name: No Python traceback in the container log
        run: |
          set -euo pipefail
          LOGS=$(docker logs smoke 2>&1)
          if grep -qF 'Traceback (most recent call last)' <<< "$LOGS"; then
            echo "FAIL container log contains a Python traceback"
            printf '%s\n' "$LOGS"
            exit 1
          fi
          echo "OK no Python traceback in the container log"

      - name: Container logs and cleanup
        if: always()
        run: |
          echo "--- container logs ---"
          docker logs smoke || true
          docker stop smoke >/dev/null 2>&1 || true
