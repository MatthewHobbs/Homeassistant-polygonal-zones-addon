name: Release addon

on:
  push:
    tags:
      - 'v*'
  # A change to the release path runs every gate as a dry run before it
  # merges. The publish and release jobs themselves still first run on a tag.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/build.yml
      - .github/workflows/test.yml
      - .github/workflows/lint.yml
      - scripts/check-published-revision.sh
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check (without v prefix, e.g. 0.2.12); must equal config.yaml's"
        required: true
      dry_run:
        description: "Run every gate but push nothing. Publishing also needs the run to be on a v* tag."
        type: boolean
        default: true

# Read-only unless a job below asks for more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and every tag: the on-main and version-order checks need both.
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) VERSION="$INPUT_VERSION" ;;
            pull_request) VERSION=$(awk -F'"' '/^version:/{print $2}' polygonal_zones_editor/config.yaml) ;;
            *) VERSION="${GITHUB_REF#refs/tags/v}" ;;
          esac
          # It becomes an image tag and a release name, so hold it to X.Y.Z,
          # and print it only once it is known to be just that.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version is not X.Y.Z"
            exit 1
          fi
          echo "Resolved version: $VERSION"
          # A dispatch on a tag must name that tag's version, or it could
          # publish one version's images from another version's commit.
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::version '$VERSION' does not match the ref $GITHUB_REF"
            exit 1
          fi
          # A tag must point at a commit main contains: images built from a
          # commit that never landed would ship code nobody merged.
          if [[ "$GITHUB_REF" == refs/tags/* ]] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF is not on main"
            exit 1
          fi
          # A tag below an earlier release would publish a downgrade. Re-running
          # its own tag passes.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git tag -l 'v*' | scripts/check-version-order.sh "$VERSION"
          fi
          # Sanity-check: must match the version in config.yaml so we don't
          # publish images that disagree with what the Supervisor expects.
          CONFIG_VERSION=$(awk -F'"' '/^version:/{print $2}' polygonal_zones_editor/config.yaml)
          if [ "$VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::tag/input version '$VERSION' does not match config.yaml version '$CONFIG_VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract the CHANGELOG entry
        # Here, not in the `release` job, so a missing entry stops the run
        # before any image is pushed; `release` uses this output.
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=$(scripts/changelog-notes.sh "$VERSION")
          delim="notes_$(openssl rand -hex 16)"
          printf 'notes<<%s\n%s\n%s\n' "$delim" "$NOTES" "$delim" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    # Re-run the unit tests for the tagged SHA. `push: tags` does not trigger
    # test.yml (it only fires on branch pushes and PRs), so without this gate
    # a tag could be pushed on a SHA that never had a green test run.
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  lint:
    name: Lint
    # Re-run the addon linter for the tagged SHA. Same rationale as tests —
    # push: tags doesn't trigger lint.yml, so without this gate a tag could
    # be pushed on a SHA whose config.yaml is invalid against the HA addon
    # linter.
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  build:
    name: Build + smoke
    # Rebuild, boot-smoke and Playwright-smoke the tagged SHA, each arch natively, so a
    # release cannot publish from a SHA whose image was never booted. Publish rebuilds,
    # so this proves the SHA, not the pushed bytes. Its `include` output is publish's
    # arch matrix.
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: Publish (${{ matrix.arch }})
    needs: [version, tests, lint, build]
    # Only a v* tag publishes: a tag push, or a dispatch with dry_run
    # unticked. Any other trigger, pull_request included, is a dry run.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    # Native runner per arch, as build.yml uses: no QEMU emulator image in a
    # job that holds packages:write and id-token:write.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write       # push images to ghcr.io
      id-token: write       # keyless Sigstore signing via GitHub OIDC
      attestations: write   # publish build-provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # BuildKit pinned by digest (it runs in the job that holds packages:write);
      # build.yml uses the same pin, so every PR builds with it. Renovate
      # rewrites tag, digest and comment together in both files.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea # v0.33.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          owner=$(tr '[:upper:]' '[:lower:]' <<< "$OWNER")
          echo "repo=ghcr.io/$owner/$ARCH-addon-polygonal_zones" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a different build of this version
        # A re-run of a partial publish re-pushes the same commit and passes;
        # anything else already under this tag stops the leg before the push.
        env:
          IMAGE: ${{ steps.image.outputs.repo }}:${{ needs.version.outputs.version }}
          REVISION: ${{ github.sha }}
        run: scripts/check-published-revision.sh "$IMAGE" "$REVISION"

      - name: Build and push polygonal_zones image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./polygonal_zones_editor
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          # Read back by check-published-revision.sh on any later run.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          # The version tag only: Supervisor resolves the image from
          # config.yaml's `version:`, and a :latest would point at mixed
          # versions across arches after a mid-matrix failure.
          tags: |
            ${{ steps.image.outputs.repo }}:${{ needs.version.outputs.version }}
          # Built from scratch: the gate jobs write the shared build cache and
          # run unverified downloads, so publish must not read it.
          no-cache: true

      - name: Scan the pushed image for known vulnerabilities
        # Provenance says who built these bytes, not what is in them. Trivy by
        # digest with this job's token, before the attestation, so a failing
        # scan is never signed as shipped. --platform names the leg's arch:
        # a per-arch image is a one-child index. --ignore-unfixed: fail only
        # where a fix exists.
        env:
          IMAGE: ${{ steps.image.outputs.repo }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            -v "$PWD/.trivyignore:/trivyignore:ro" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image \
            --quiet --no-progress \
            --cache-dir /tmp/trivy \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /trivyignore \
            --exit-code 1 \
            --platform "linux/${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}" \
            "$IMAGE"

      # Sign the pushed image with a Sigstore build-provenance attestation
      # (keyless, via GitHub OIDC — no secret to manage).
      # The attestation is pushed to GHCR alongside the image and is
      # verifiable by anyone with:
      #   gh attestation verify oci://<image>:<version> --owner MatthewHobbs
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Create GitHub Release
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release
    steps:
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout here, so gh has no git remote to find the repo from.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --title "$TAG"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  notify-failure:
    # Fires when any upstream release job fails. Opens a GitHub issue so a
    # partial release (some arches pushed, others failed) doesn't go silent
    # and drift into "users on different versions depending on arch".
    name: Notify on failure
    # Real releases only: a failed dry run publishes nothing and its run page
    # already shows what broke.
    if: failure() && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    needs: [version, tests, lint, build, publish, release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout here, so gh has no git remote to find the repo from.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # version may not have run (e.g. lint failed first) so fall back to
          # the ref name rather than failing the notify step too.
          TAG="v${VERSION:-${GITHUB_REF#refs/tags/v}}"
          gh issue create --title "Release $TAG failed" --label bug \
            --body "The release workflow failed for $TAG. See the run: ${RUN_URL}. Check which jobs failed; a partial publish may have pushed some arches but not others. Recover by re-running the failed jobs after fixing the cause."
