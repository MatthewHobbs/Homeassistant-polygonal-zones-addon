name: Lint addon

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Release workflow calls this as a prerequisite gate, so a tag push never
  # publishes an image with a broken config.yaml or addon-linter violation
  # on the tagged SHA.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefix with "lint-" so this doesn't share a group with test.yml when
  # both are called from release.yml. Reusable workflows inherit the
  # caller's `github.workflow` and `github.ref`, so a plain
  # "${{ github.workflow }}-${{ github.ref }}" group collides with tests'
  # and cancels whichever runs second.
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint polygonal_zones_editor
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./polygonal_zones_editor"

  apparmor:
    # AppArmor is enforced by the Supervisor, not by a local docker run or the
    # build job, so a malformed profile can break startup without any other
    # job noticing. Compile it with the real parser; -Q skips
    # the kernel load, -K the cache, so this needs no AppArmor-enabled host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AppArmor profile compiles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apparmor
          apparmor_parser -Q -K polygonal_zones_editor/apparmor.txt
          echo "apparmor.txt compiled OK"

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from requirements-dev.txt, which Dependabot bumps: with
      # no version the action installs the latest ruff, and a new release could
      # fail this job, which gates release.yml.
      - name: Run ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: polygonal_zones_editor/requirements-dev.txt
          args: check --output-format=github
      - name: Check formatting
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: polygonal_zones_editor/requirements-dev.txt
          args: format --check --diff

  ha-floor:
    # config.yaml's `homeassistant:` floor must satisfy the
    # bound (at most the .1 of the month before current stable Core,
    # read live from stable.json). Deliberately NOT a required check, like the
    # companion integration's, so an outage at version.home-assistant.io
    # cannot block every merge. Skipped when release.yml
    # calls this workflow on a tag for the same reason: the tagged SHA already
    # ran it on its PR and on main.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Declared HA floor is within its bound
        run: scripts/ha-floor-check.sh

  shellcheck:
    # release-merge.sh gates every version bump and the rootfs scripts drive
    # container boot; `bash -n` misses the quoting and word-splitting mistakes
    # shellcheck catches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        # shellcheck is preinstalled on ubuntu-latest. rootfs s6 scripts
        # don't have a .sh extension but use bash syntax; check them
        # explicitly by path. `-x` lets shellcheck follow sourced files.
        run: |
          set -euo pipefail
          # Same files as the justfile's lint recipe; keep the two lists identical.
          shellcheck -x scripts/release-merge.sh scripts/supervisor-pilot.sh scripts/ha-floor-check.sh scripts/test-release-merge.sh scripts/check-published-revision.sh scripts/test-check-published-revision.sh scripts/test-ha-floor-check.sh scripts/check-version-order.sh scripts/test-check-version-order.sh
          shellcheck -x \
            polygonal_zones_editor/rootfs/etc/cont-init.d/00-fix-perms \
            polygonal_zones_editor/rootfs/etc/services.d/web/run \
            polygonal_zones_editor/rootfs/etc/services.d/web/finish
