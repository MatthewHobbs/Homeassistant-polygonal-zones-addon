name: Supervisor pilot

# Install, configure and use the add-on under a real stable-channel
# Supervisor and Core, in the official add-on devcontainer. Required on
# every PR, through the `Supervisor pilot` job at the end.
# All of the logic is in scripts/supervisor-pilot.sh, which runs the same
# way locally.

on:
  # Every PR runs the full matrix: a PR that changes only app/ or rootfs/
  # can break the add-on under a real Supervisor too.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      floor_core:
        description: Override the floor leg's Core version (default is config.yaml's homeassistant:)
        type: string
      disable_apparmor:
        description: Install the add-on with apparmor false (diagnosis only)
        type: boolean
        default: false
  # Nightly: amd64 against stable Core only. Friday: the full matrix. The pilot
  # job's matrix tells them apart by the nightly cron string, so keep the two equal.
  schedule:
    - cron: "37 3 * * 0-4,6"
    - cron: "37 3 * * 5"

permissions:
  contents: read

concurrency:
  # Prefixed so that, if this is ever made reusable, a caller's inherited
  # github.workflow and github.ref cannot cancel a sibling there.
  group: supervisor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    # The floor leg tests the Core the add-on declares,
    # read from config.yaml so it cannot drift from what the Supervisor
    # enforces on users. The floor_core input only overrides it.
    name: Resolve the floor
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.floor.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: floor
        env:
          OVERRIDE: ${{ inputs.floor_core }}
        run: |
          set -euo pipefail
          if [[ -n "$OVERRIDE" ]]; then
            core="$OVERRIDE"
            echo "floor leg: Core $core (floor_core input, overriding config.yaml)"
          else
            core="$(scripts/ha-floor-check.sh --declared)"
            echo "floor leg: Core $core (config.yaml homeassistant:)"
          fi
          echo "core=$core" >>"$GITHUB_OUTPUT"

  pilot:
    name: ${{ matrix.arch }} / Core ${{ matrix.core }}
    needs: floor
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(github.event.schedule == '37 3 * * 0-4,6' && '["amd64"]' || '["amd64", "aarch64"]') }}
        # "stable" is whatever stable.json names today; the other leg pins the declared
        # floor under the same Supervisor. vars.PILOT_STABLE_CORE pins the stable leg on
        # PRs and dispatches while a new stable Core is broken upstream; schedules ignore
        # it.
        core: ${{ fromJson(github.event.schedule == '37 3 * * 0-4,6' && '["stable"]' || format('["{0}", "{1}"]', (github.event_name != 'schedule' && vars.PILOT_STABLE_CORE) || 'stable', needs.floor.outputs.core)) }}
    env:
      CORE_VERSION: ${{ matrix.core }}
      PILOT_KEEP: "1"
      PILOT_DISABLE_APPARMOR: ${{ inputs.disable_apparmor && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On a failed phase, `all` writes diagnostics to $PILOT_WORKDIR/diagnostics.
      - name: Run the add-on under the stable Supervisor
        env:
          PILOT_WORKDIR: ${{ runner.temp }}/pilot
        run: scripts/supervisor-pilot.sh all

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supervisor-pilot-${{ matrix.arch }}-${{ matrix.core }}
          path: ${{ runner.temp }}/pilot/diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: scripts/supervisor-pilot.sh down

  # One stable name for branch protection: the leg names carry the floor's
  # Core version, which changes with config.yaml.
  result:
    name: Supervisor pilot
    needs: [floor, pilot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every leg passed
        env:
          FLOOR: ${{ needs.floor.result }}
          PILOT: ${{ needs.pilot.result }}
          # A diagnosis run posts this check on the same SHA, so it must not
          # pass with AppArmor off or a floor other than the declared one.
          OVERRIDDEN: ${{ inputs.disable_apparmor || (inputs.floor_core || '') != '' }}
          PIN: ${{ vars.PILOT_STABLE_CORE }}
        run: |
          [ -z "$PIN" ] || echo "::warning::PILOT_STABLE_CORE=$PIN pins the stable leg on PRs; unset it once stable Core passes the nightly"
          echo "floor=$FLOOR pilot=$PILOT overridden=$OVERRIDDEN"
          [ "$OVERRIDDEN" != true ] && [ "$FLOOR" = success ] && [ "$PILOT" = success ]
