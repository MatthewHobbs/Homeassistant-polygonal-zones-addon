name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Release workflow calls this as a prerequisite gate, so a tag push never
  # publishes an image without the unit tests passing on the same SHA.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefix with "tests-" so this doesn't share a group with lint.yml when
  # both are called from release.yml. Reusable workflows inherit the
  # caller's `github.workflow` and `github.ref`, so a plain
  # "${{ github.workflow }}-${{ github.ref }}" group collides with lint's
  # and cancels whichever runs second.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            polygonal_zones_editor/requirements-lock.txt
            polygonal_zones_editor/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r polygonal_zones_editor/requirements-dev.txt
          # The lock the image installs, last, so a dev dependency can't move it.
          pip install --require-hashes -r polygonal_zones_editor/requirements-lock.txt
          # The lock wins over dev dependencies; fail if that leaves one broken.
          pip check
      - name: Run pytest
        working-directory: polygonal_zones_editor
        run: pytest -v
      # In this required job so a version bump with no usable CHANGELOG entry
      # fails before it merges, not after it is tagged.
      - name: config.yaml's version has a CHANGELOG entry
        run: scripts/changelog-notes.sh "$(awk -F'"' '/^version:/{print $2}' polygonal_zones_editor/config.yaml)" >/dev/null
      - name: Run changelog-notes.sh checks
        run: scripts/test-changelog-notes.sh
      - name: Run release-merge.sh regression checks
        run: scripts/test-release-merge.sh
      - name: Run check-published-revision.sh regression checks
        run: scripts/test-check-published-revision.sh
      - name: Run ha-floor-check.sh bound checks
        run: scripts/test-ha-floor-check.sh
      - name: Run check-version-order.sh checks
        run: scripts/test-check-version-order.sh
      - name: Run trackers.js tests
        # node is preinstalled on ubuntu-latest, same as shellcheck in
        # lint.yml — no explicit version pin, matching that precedent.
        working-directory: polygonal_zones_editor
        run: node --test tests/test_trackers.js tests/test_map.js
