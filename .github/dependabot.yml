# Python only. Actions, Dockerfile FROM lines and the digest-pinned base images are
# Renovate's (.github/renovate.json5): Dependabot's docker manager cannot follow a custom
# YAML field. Python stays here because the locks are hash-locked `uv pip compile`
# output and Dependabot understands that pair.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/polygonal_zones_editor"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/London"
    groups:
      python:
        patterns:
          - "*"
