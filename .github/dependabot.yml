# Dependabot — Python only. GitHub Actions, the Dockerfile FROM lines, and the digest-pinned
# base images in .github/base-images.yaml moved to Renovate (.github/renovate.json5), which can
# follow a custom YAML field that Dependabot's docker manager cannot.
#
# Python stays here: requirements-lock.txt is a hash-locked `uv pip compile` output installed
# with --require-hashes, and Dependabot understands the requirements.txt/lock pair.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/polygonal_zones_editor"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/London"
    groups:
      python:
        patterns:
          - "*"
