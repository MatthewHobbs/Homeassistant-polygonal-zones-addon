name: "Polygonal Zones"
description: "Helper app for the polygonal zones integration."
version: "0.7.4"
# Auto-update stops here. 0.5.8 closed LAN access without save_token; 0.7.0
# removes the push_to_core option and the /push_status endpoint, and refuses a
# zone with no name, so every install below it needs a manual update.
breaking_versions:
  - "0.5.8"
  - "0.7.0"
# Oldest Core this add-on is offered to. The
# Supervisor pilot tests this exact Core, and lint.yml's ha-floor job holds it
# to its bound: never newer than the .1 of the month before current stable.
homeassistant: "2026.8.1"
slug: "polygonal_zones"
url: "https://github.com/MatthewHobbs/Homeassistant-polygonal-zones-addon/tree/main/polygonal_zones_editor"
# release.yml attests every published image; `codenotary` stays unset because
# CAS is discontinued and the key was removed in Home Assistant 2026.x. Verify an
# image with `gh attestation verify oci://ghcr.io/matthewhobbs/<arch>-addon-polygonal_zones:<version>`.
panel_icon: "mdi:map"
# Pre-built images published by .github/workflows/release.yml on each
# v* tag. Supervisor pulls instead of building locally — much faster
# updates on slow ARM hardware.
image: "ghcr.io/matthewhobbs/{arch}-addon-polygonal_zones"

init: false
arch:
  - aarch64
  - amd64
# The addon only serves data that the polygonal-zones integration polls from
# Home Assistant Core, so it belongs in the `services` tier rather than
# `system`. `system` is for DNS / Supervisor-level services that must come up
# before Core.
startup: services
ingress: true
ingress_port: 8000
# TCP 8000 is declared but unmapped by default. Users who want direct LAN
# access (curl backups, the companion integration) map a host port under
# Supervisor -> Network; every non-ingress request then needs save_token.
ports:
  8000/tcp: null

# Home Assistant API access, granted at install and not read-only. The add-on
# uses it only for /trackers.json, issuing GET /states/<entity_id> for each
# entity named in `overlay_entities`; that list is empty by default, and with
# it empty the add-on asks Home Assistant for nothing at all.
homeassistant_api: true
discovery:
  - polygonal_zones

options:
  allow_all_ips: false
  overlay_entities: []
  tracker_refresh_seconds: 60
  zone_colour: purple
  trusted_proxies: ""
  log_level: info
  save_token: ""
  theme: auto
schema:
  # Grants nothing; kept so existing configs still validate.
  allow_all_ips: bool
  overlay_entities:
    - str?
  tracker_refresh_seconds: int(0,3600)?
  zone_colour: match(^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]+$)
  trusted_proxies: str?
  log_level: list(debug|info|warning|error|critical)?
  save_token: password?
  theme: list(auto|light|dark)?
