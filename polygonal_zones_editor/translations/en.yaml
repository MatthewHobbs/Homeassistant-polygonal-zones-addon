configuration:
  zone_colour:
    name: Zone colour
    description: >-
      Colour used to render zones on the map. Any CSS colour name
      (e.g. purple, red, teal) or hex value (e.g. #800080).
  theme:
    name: Theme
    description: >-
      auto follows your OS / browser prefers-color-scheme setting.
      light or dark force the corresponding palette regardless of OS
      preference.
  allow_all_ips:
    name: Allow LAN access (no longer used)
    description: >-
      No longer grants LAN access, whatever its value; turning it on
      only logs an error at startup. LAN clients (the companion
      integration, curl) need save_token instead, and the editor is
      used from Home Assistant.
  save_token:
    name: Save token
    description: >-
      Required for any access that does not come through Home
      Assistant itself (the sidebar or Open Web UI). Every such
      request, read or write, must send the header
      X-Save-Token:<value>; with this empty, nothing outside Home
      Assistant can reach the add-on. Never logged.
  trusted_proxies:
    name: Trusted proxies
    description: >-
      Comma-separated list of the IP address of each reverse proxy whose
      X-Forwarded-For header should be honoured. List each proxy's own IP
      rather than a range: a range is accepted with a warning in the log.
      Leave empty unless you front the addon with your own reverse proxy.
      Wildcards (*, 0.0.0.0/0) and the HA ingress IP (172.30.32.2) are
      refused and logged as errors.
  overlay_entities:
    name: Trackers to show on the map
    description: >-
      Entity ids (e.g. device_tracker.my_car) whose live positions the
      editor plots over your zones. Clicking one reads its last 24 h of
      history to show when it arrived. Empty by default, and while empty
      the add-on asks Home Assistant for nothing. These positions are
      readable by anyone holding the save_token, so prefer vehicles
      over people.
  tracker_refresh_seconds:
    name: Tracker refresh interval
    description: >-
      Seconds between updates of the tracker positions on the map
      while the editor is open. 0 loads them once when the page
      opens. Values from 1 to 9 are treated as 10. Only used when
      overlay_entities is set.
  log_level:
    name: Log level
    description: >-
      Verbosity of the addon log. Bump to debug when troubleshooting.
