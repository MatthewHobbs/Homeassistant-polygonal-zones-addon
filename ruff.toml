# Mirrors the companion integration's configuration
# (MatthewHobbs/Homeassistant-polygonal-zones) so both halves of the project
# are held to one standard.
line-length = 100
# py312, the oldest Python that runs this repo's code: scripts/ run on the CI
# runners' python3. The add-on itself runs 3.14.
target-version = "py312"

[lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "ASYNC", # flake8-async
  "RUF",   # ruff-specific
]
ignore = [
  "E501",  # line length is handled by the formatter
  "B008",  # function call in default argument (common HA/Starlette pattern)
]

[lint.isort]
force-sort-within-sections = true
# The app runs with `pythonpath = app`, so these are imported as bare modules
# and would otherwise be sorted in with third-party packages — which reorders
# every import block in the repo for no benefit.
known-first-party = ["const", "helpers", "main"]
